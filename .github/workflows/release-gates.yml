name: Release gates

on:
  push:
    branches: [main, dev, "release/**"]
  pull_request:
    branches: [main, dev, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests and PostgreSQL 17 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-integrations.txt
            requirements-dev.txt
            requirements-ai.txt
            requirements-ai-pytorch.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
          python -m pip_audit -r requirements-integrations.txt
          python -m pip_audit -r requirements-ai.txt
          python -m pip_audit -r requirements-ai-pytorch.txt

      - name: Run full test suite and PostgreSQL migration parity test
        env:
          ENVIRONMENT: testing
          RUN_POSTGRES17_INTEGRATION: "1"
          POSTGRES17_TEST_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/postgres
        run: python -m pytest -q --durations=10

  onboarding-ui:
    name: Build onboarding UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: onboarding-ui/package-lock.json

      - name: Install locked UI dependencies
        working-directory: onboarding-ui
        run: npm ci --no-audit --no-fund

      - name: Audit UI dependencies
        working-directory: onboarding-ui
        run: npm audit --audit-level=moderate

      - name: Test UI pricing utilities
        working-directory: onboarding-ui
        run: npm test

      - name: Build UI
        working-directory: onboarding-ui
        run: npm run build

  compose-config:
    name: Validate Compose configurations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate development Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f docker-compose.yml config --quiet

      - name: Validate production Compose configuration
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.prod.yml config --quiet

  production-image:
    name: Build production API image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build production image
        run: docker build --target production-ai --tag avinya-hms-api:ci .

      - name: Scan production image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: avinya-hms-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan ClamAV image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clamav/clamav:1.4.6-debian13-slim@sha256:c7df83a4c9794aeb43b7cff296fc9f42a0f47cbf0e96704510e7e5b57b2f4913
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
