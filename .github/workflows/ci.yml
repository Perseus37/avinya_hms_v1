name: Avinya HMS Enterprise CI/CD

on:
  push:
    branches: [ "main", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Automated Test Suite (136 Scenarios)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Execute Pytest Suite (Ephemeral Secrets Auto-Generated in conftest.py)
        run: |
          pytest -v --durations=10

  build-containers:
    name: Build & Verify Production Images
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: avinya-hms-api:latest

      - name: Build KMS Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.kms
          push: false
          tags: avinya-hms-kms:latest