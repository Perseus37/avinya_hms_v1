services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
    command:
      - postgres
      - -c
      - timezone=${APP_TIMEZONE:?APP_TIMEZONE is required}
      - -p
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}"
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:?POSTGRES_PUBLISHED_PORT is required}:${POSTGRES_PORT:?POSTGRES_PORT is required}"
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p $$POSTGRES_PORT -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: avinya-hms-api:latest
    restart: "no"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
    command: python backend/scripts/bootstrap.py

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT is required}
    command:
      - sh
      - -c
      - exec redis-server --port "$${REDIS_PORT:?REDIS_PORT is required}" --appendonly yes --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    ports:
      - "127.0.0.1:${REDIS_PUBLISHED_PORT:?REDIS_PUBLISHED_PORT is required}:${REDIS_PORT:?REDIS_PORT is required}"
    volumes:
      - hms_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli -p $$REDIS_PORT ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  clamav:
    image: clamav/clamav:1.4.6-debian13-slim@sha256:c7df83a4c9794aeb43b7cff296fc9f42a0f47cbf0e96704510e7e5b57b2f4913
    restart: unless-stopped
    volumes:
      - hms_clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - scanner-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: avinya-hms-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      CLAMD_HOST: clamav
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
    command:
      - gunicorn
      - backend.main:app
      - --workers
      - "${GUNICORN_WORKERS:?GUNICORN_WORKERS is required}"
      - --worker-class
      - uvicorn.workers.UvicornWorker
      - --bind
      - 0.0.0.0:${API_PORT:?API_PORT is required}
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    ports:
      - "127.0.0.1:${API_PUBLISHED_PORT:?API_PUBLISHED_PORT is required}:${API_PORT:?API_PORT is required}"
    volumes:
      - hms_backups:/app/backups
      - hms_attachments:/app/attachments
    depends_on:
      db-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - default
      - scanner-net

  hl7-listener:
    image: avinya-hms-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
    command: ["python", "-m", "backend.domains.integrations.listener"]
    ports:
      - "${HL7_PORT:-2575}:${HL7_PORT:-2575}"
    healthcheck:
      disable: true
    profiles:
      - integrations
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: avinya-hms-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      CLAMD_HOST: clamav
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
    command: ["python", "-m", "backend.worker"]
    volumes:
      - hms_backups:/app/backups
      - hms_attachments:/app/attachments
    healthcheck:
      disable: true
    depends_on:
      db-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  onboarding-portal:
    image: avinya-hms-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
    command: ["uvicorn", "backend.control_plane.app:app", "--host", "0.0.0.0", "--port", "${CONTROL_PLANE_PORT:?CONTROL_PLANE_PORT is required}"]
    ports:
      - "127.0.0.1:${CONTROL_PLANE_PUBLISHED_PORT:?CONTROL_PLANE_PUBLISHED_PORT is required}:${CONTROL_PLANE_PORT:?CONTROL_PLANE_PORT is required}"
    volumes:
      - hms_backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -f \"http://localhost:$$CONTROL_PLANE_PORT/\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  backup-sidecar:
    image: avinya-hms-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
    command:
      - python
      - backend/scripts/backup_service.py
      - --daemon
      - --interval
      - "${BACKUP_INTERVAL_SECONDS:?BACKUP_INTERVAL_SECONDS is required}"
      - --output-dir
      - "${BACKUP_OUTPUT_DIR:?BACKUP_OUTPUT_DIR is required}"
    volumes:
      - hms_backups:/app/backups
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  backup-vault:
    image: avinya-hms-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      VAULT_POLL_INTERVAL_SECONDS: "${VAULT_POLL_INTERVAL_SECONDS:?VAULT_POLL_INTERVAL_SECONDS is required}"
    command:
      - python
      - backend/scripts/backup_service.py
      - --daemon
      - --vault-mode
    volumes:
      - hms_backups:/source:ro
      - hms_vault_storage:/vault
    healthcheck:
      disable: true

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: testing
    image: avinya-hms-test:latest
    profiles: ["test"]
    environment:
      ENVIRONMENT: "testing"
    volumes:
      - .:/app

volumes:
  hms_pgdata:
  hms_redisdata:
  hms_backups:
  hms_attachments:
  hms_clamav_db:
  hms_vault_storage:

networks:
  scanner-net:
    driver: bridge
    internal: true