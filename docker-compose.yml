services:
  reverse-proxy:
    image: traefik:v2.11
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: "Asia/Kolkata"
      PGTZ: "Asia/Kolkata"
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - hms_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: avinya-hms-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: "Asia/Kolkata"
      PGTZ: "Asia/Kolkata"
    ports:
      - "8000:8000"
    volumes:
      - hms_backups:/app/backups
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hms-api.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.${BASE_DOMAIN}`)"
      - "traefik.http.services.hms-api.loadbalancer.server.port=8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  onboarding-portal:
    image: avinya-hms-api:latest
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "onboarding_portal:onboarding_app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - hms_backups:/app/backups
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onboard.rule=Host(`onboard.${BASE_DOMAIN}`)"
      - "traefik.http.services.onboard.loadbalancer.server.port=8080"
    depends_on:
      db:
        condition: service_healthy

  backup-sidecar:
    image: avinya-hms-api:latest
    restart: unless-stopped
    env_file: .env
    command: ["python", "backend/scripts/backup_service.py", "--daemon"]
    volumes:
      - hms_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy

  # Only runs on 'dev' when you explicitly run: docker compose --profile test run --rm test-runner
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: testing
    image: avinya-hms-test:latest
    profiles: ["test"]
    environment:
      ENVIRONMENT: "testing"
      PYTHONPATH: "/app/backend:/app/backend/core:/app/backend/scripts"
    volumes:
      - .:/app

volumes:
  hms_pgdata:
  hms_redisdata:
  hms_backups: