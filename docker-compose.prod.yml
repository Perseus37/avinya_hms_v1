services:
  docker-proxy:
    image:   tecnativa/docker-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal-net

  reverse-proxy:
    image: traefik:v2.11
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le-ssl.acme.email=${ACME_EMAIL:-admin@avinyahms.com}"
      - "--certificatesresolvers.le-ssl.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le-ssl.acme.dnschallenge=true"
      - "--certificatesresolvers.le-ssl.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.le-ssl.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik_certificates:/letsencrypt
    networks:
      - public-net
      - internal-net

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      TZ: "Asia/Kolkata"
      PGTZ: "Asia/Kolkata"
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - hms_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - internal-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: avinya-hms-api:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      TZ: "Asia/Kolkata"
      PGTZ: "Asia/Kolkata"
    volumes:
      - hms_backups:/app/backups
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hms-api.rule=Host(`${BASE_DOMAIN}`) || HostRegexp(`{subdomain:[a-z0-9-]+}.${BASE_DOMAIN}`)"
      - "traefik.http.routers.hms-api.entrypoints=websecure"
      - "traefik.http.routers.hms-api.tls=true"
      - "traefik.http.routers.hms-api.tls.certresolver=le-ssl"
      - "traefik.http.routers.hms-api.tls.domains[0].main=${BASE_DOMAIN}"
      - "traefik.http.routers.hms-api.tls.domains[0].sans=*.${BASE_DOMAIN}"
      - "traefik.http.services.hms-api.loadbalancer.server.port=8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal-net
      - public-net

  onboarding-portal:
    image: avinya-hms-api:latest
    restart: unless-stopped
    env_file: .env.production
    command: ["uvicorn", "onboarding_portal:onboarding_app", "--host", "0.0.0.0", "--port", "8080"]
    volumes:
      - hms_backups:/app/backups
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onboard.rule=Host(`onboard.${BASE_DOMAIN}`)"
      - "traefik.http.routers.onboard.entrypoints=websecure"
      - "traefik.http.routers.onboard.tls=true"
      - "traefik.http.routers.onboard.tls.certresolver=le-ssl"
      - "traefik.http.services.onboard.loadbalancer.server.port=8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net
      - public-net

  backup-sidecar:
    image: avinya-hms-api:latest
    restart: unless-stopped
    env_file: .env.production
    command: ["python", "backend/scripts/backup_service.py", "--daemon"]
    volumes:
      - hms_backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal-net

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true

volumes:
  hms_pgdata:
  hms_redisdata:
  hms_backups:
  traefik_certificates: