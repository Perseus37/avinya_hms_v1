services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    read_only: true
    environment:
      - CONTAINERS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal-net

  reverse-proxy:
    image: traefik:v2.11
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:${TRAEFIK_HTTP_PORT:?TRAEFIK_HTTP_PORT is required}"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:${TRAEFIK_HTTPS_PORT:?TRAEFIK_HTTPS_PORT is required}"
      - "--certificatesresolvers.le-ssl.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}"
      - "--certificatesresolvers.le-ssl.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le-ssl.acme.dnschallenge=true"
      - "--certificatesresolvers.le-ssl.acme.dnschallenge.provider=${ACME_DNS_PROVIDER:?ACME_DNS_PROVIDER is required}"
      - "--certificatesresolvers.le-ssl.acme.dnschallenge.resolvers=${ACME_DNS_RESOLVERS:?ACME_DNS_RESOLVERS is required}"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:?CF_DNS_API_TOKEN is required}
    ports:
      - "${PUBLIC_HTTP_PORT:?PUBLIC_HTTP_PORT is required}:${TRAEFIK_HTTP_PORT:?TRAEFIK_HTTP_PORT is required}"
      - "${PUBLIC_HTTPS_PORT:?PUBLIC_HTTPS_PORT is required}:${TRAEFIK_HTTPS_PORT:?TRAEFIK_HTTPS_PORT is required}"
    volumes:
      - traefik_certificates:/letsencrypt
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - public-net
      - internal-net

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    env_file: .env.production
    environment:
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
    command:
      - postgres
      - -c
      - timezone=${APP_TIMEZONE:?APP_TIMEZONE is required}
      - -p
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}"
    volumes:
      - hms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p $$POSTGRES_PORT -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal-net

  db-init:
    image: avinya-hms-api:${VERSION:-v4.5.0}
    restart: "no"
    security_opt:
      - "no-new-privileges:true"
    env_file: .env.production
    environment:
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
    command: ["python", "backend/scripts/bootstrap.py"]
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT is required}
      REDIS_MAX_MEMORY: ${REDIS_MAX_MEMORY:?REDIS_MAX_MEMORY is required}
    command:
      - sh
      - -c
      - exec redis-server --port "$${REDIS_PORT:?REDIS_PORT is required}" --appendonly yes --maxmemory "$${REDIS_MAX_MEMORY:?REDIS_MAX_MEMORY is required}" --maxmemory-policy volatile-lru --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - hms_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli -p $$REDIS_PORT ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - internal-net

  clamav:
    image: clamav/clamav:1.4.6-debian13-slim@sha256:c7df83a4c9794aeb43b7cff296fc9f42a0f47cbf0e96704510e7e5b57b2f4913
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - hms_clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - scanner-net
      - scanner-egress

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-ai
    image: avinya-hms-api:${VERSION:-v4.5.0}
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    env_file: .env.production
    environment:
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
    command:
      - gunicorn
      - backend.main:app
      - --workers
      - "${GUNICORN_WORKERS:?GUNICORN_WORKERS is required}"
      - --worker-class
      - uvicorn.workers.UvicornWorker
      - --bind
      - 0.0.0.0:${API_PORT:?API_PORT is required}
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
    volumes:
      - hms_backups:/app/backups
      - ${ATTACHMENTS_HOST_PATH:?ATTACHMENTS_HOST_PATH is required}:/app/attachments
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hms-api.rule=Host(`${BASE_DOMAIN:?BASE_DOMAIN is required}`) || HostRegexp(`{subdomain:[a-z0-9-]+}.${BASE_DOMAIN:?BASE_DOMAIN is required}`)"
      - "traefik.http.routers.hms-api.entrypoints=websecure"
      - "traefik.http.routers.hms-api.tls=true"
      - "traefik.http.routers.hms-api.tls.certresolver=le-ssl"
      - "traefik.http.routers.hms-api.tls.domains[0].main=${BASE_DOMAIN:?BASE_DOMAIN is required}"
      - "traefik.http.routers.hms-api.tls.domains[0].sans=*.${BASE_DOMAIN:?BASE_DOMAIN is required}"
      - "traefik.http.services.hms-api.loadbalancer.server.port=${API_PORT:?API_PORT is required}"
    depends_on:
      db-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    networks:
      - internal-net
      - public-net
      - scanner-net

  hl7-listener:
    image: avinya-hms-api:${VERSION:-v4.5.0}
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    env_file: .env.production
    environment:
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
    command: ["python", "-m", "backend.domains.integrations.listener"]
    ports:
      - "${HL7_PORT:-2575}:${HL7_PORT:-2575}"
    profiles:
      - integrations
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal-net

  worker:
    image: avinya-hms-api:${VERSION:-v4.5.0}
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    env_file: .env.production
    environment:
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
    command: ["python", "-m", "backend.worker"]
    volumes:
      - hms_backups:/app/backups
      - ${ATTACHMENTS_HOST_PATH:?ATTACHMENTS_HOST_PATH is required}:/app/attachments
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      db-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal-net

  onboarding-portal:
    image: avinya-hms-api:${VERSION:-v4.5.0}
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    env_file: .env.production
    environment:
      TZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
      PGTZ: "${APP_TIMEZONE:?APP_TIMEZONE is required}"
    command: ["uvicorn", "backend.control_plane.app:app", "--host", "0.0.0.0", "--port", "${CONTROL_PLANE_PORT:?CONTROL_PLANE_PORT is required}"]
    volumes:
      - hms_backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "curl -f \"http://localhost:$$CONTROL_PLANE_PORT/\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onboard.rule=Host(`onboard.${BASE_DOMAIN:?BASE_DOMAIN is required}`)"
      - "traefik.http.routers.onboard.entrypoints=websecure"
      - "traefik.http.routers.onboard.tls=true"
      - "traefik.http.routers.onboard.tls.certresolver=le-ssl"
      - "traefik.http.services.onboard.loadbalancer.server.port=${CONTROL_PLANE_PORT:?CONTROL_PLANE_PORT is required}"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - internal-net
      - public-net

  prometheus:
    image: prom/prometheus:v2.53.3
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    user: "65534:65534"
    cap_drop:
      - ALL
    read_only: true
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./deployments/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployments/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - hms_prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - internal-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    user: "65534:65534"
    cap_drop:
      - ALL
    read_only: true
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./deployments/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - hms_alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O- http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    user: "65534:65534"
    cap_drop:
      - ALL
    read_only: true
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0-alpine
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    user: "65534:65534"
    cap_drop:
      - ALL
    read_only: true
    environment:
      REDIS_ADDR: "redis:${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    user: "65534:65534"
    cap_drop:
      - ALL
    read_only: true
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host/root"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/var/lib/node_exporter/textfile_collector"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - ${NODE_EXPORTER_TEXTFILE_HOST_PATH:-/var/lib/node_exporter/textfile_collector}:/var/lib/node_exporter/textfile_collector:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal-net

networks:
  public-net:
    driver: bridge
  internal-net:
    driver: bridge
    internal: true
  scanner-net:
    driver: bridge
    internal: true
  scanner-egress:
    driver: bridge

volumes:
  hms_pgdata:
  hms_redisdata:
  hms_backups:
  traefik_certificates:
  hms_clamav_db:
  hms_prometheus_data:
  hms_alertmanager_data:
